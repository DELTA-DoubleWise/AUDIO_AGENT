version: 0.1
description: >
  Benchmark-derived tool/model preferences. Resolver uses these rankings to
  fill abstract skill slots. If no matching ranking has an available concrete
  tool, it falls back to task_skills.yaml defaults.

source_images:
  - id: table3_track_i_frontend_perception_scenario_stress
    note: "User-provided image: front-end perception evaluation under stress tests. Error rates in %, lower is better; RPS higher is better."
  - id: table4_track_ii_horizontal_speech_understanding
    note: "User-provided image: horizontal comparison on ASR/GR/S2TT/SER/SLU. ASR lower is better; other scores higher are better."

dataset_registry:
  cs_dialogue:
    name: CS-Dialogue
    description: "Spontaneous Mandarin-English code-switching dialogue ASR dataset."
    language: ["zh", "en"]
    scenario: "code-switching spontaneous dialogue"
    metric_hint: "MER"
    source: "https://jglobal.jst.go.jp/en/public/202502217000295383"
  kespeech:
    name: KeSpeech
    description: "Mandarin speech with eight Chinese subdialects, large speaker coverage, ASR/dialect/speaker tasks."
    language: ["zh"]
    scenario: "Mandarin and subdialect speech"
    metric_hint: "CER"
    source: "https://openreview.net/forum?id=b3Zoeq2sCLq"
  voxpopuli_en:
    name: VoxPopuli-en
    description: "English speech from European Parliament-style public speech; used here as noisy/broadcast English ASR stress."
    language: ["en"]
    scenario: "public/broadcast speech with noise"
    metric_hint: "WER"
    source: "https://github.com/facebookresearch/voxpopuli"
  aishell_5:
    name: AISHELL-5
    description: "Open-source in-car multi-channel, multi-speaker Mandarin dataset for diarization and ASR; challenging noise/reverb setting."
    language: ["zh"]
    scenario: "in-car, multi-channel, multi-speaker, noise/reverb"
    metric_hint: "CER"
    source: "https://www.alphaxiv.org/overview/2505.23036v1"
  contextasr_en:
    name: ContextASR-En
    description: "Contextual English ASR benchmark; evaluates use of contextual/hotword/domain information."
    language: ["en"]
    scenario: "contextual ASR with hotwords or domain context"
    metric_hint: "WER"
    source: "https://chatpaper.com/paper/159288"
  contextasr_zh:
    name: ContextASR-Zh
    description: "Contextual Chinese ASR benchmark; evaluates hotword/domain/context-aware recognition."
    language: ["zh"]
    scenario: "contextual ASR with hotwords or domain context"
    metric_hint: "CER"
    source: "https://chatpaper.com/paper/159288"
  librispeech_clean:
    name: LibriSpeech clean
    description: "English read audiobook speech; clean ASR subset."
    language: ["en"]
    scenario: "clean read speech from audiobooks"
    metric_hint: "WER"
    source: "https://www.openslr.org/12"
  librispeech_other:
    name: LibriSpeech other
    description: "English read audiobook speech; harder/noisier LibriSpeech subset."
    language: ["en"]
    scenario: "less-clean read speech from audiobooks"
    metric_hint: "WER"
    source: "https://www.openslr.org/12"
  aishell_1:
    name: AISHELL-1
    description: "Open-source Mandarin read-speech ASR corpus with about 400 speakers and over 170 hours."
    language: ["zh"]
    scenario: "clean Mandarin read speech"
    metric_hint: "CER"
    source: "https://arxiv.org/abs/1709.05522"
  covost2_zh2en:
    name: CoVoST2 Zh2En
    description: "Chinese-to-English speech-to-text translation task from CoVoST2."
    language: ["zh", "en"]
    scenario: "speech translation"
    metric_hint: "character-level BLEU"
    source: "https://arxiv.org/abs/2007.10310"
  covost2_en2zh:
    name: CoVoST2 En2Zh
    description: "English-to-Chinese speech-to-text translation task from CoVoST2."
    language: ["en", "zh"]
    scenario: "speech translation"
    metric_hint: "character-level BLEU"
    source: "https://arxiv.org/abs/2007.10310"
  iemocap:
    name: IEMOCAP
    description: "Interactive emotional dyadic speech corpus commonly used for speech emotion recognition."
    language: ["en"]
    scenario: "acted/improvised dyadic emotional speech"
    metric_hint: "accuracy"
    source: "https://sail.usc.edu/iemocap/"
  mmsu_reason:
    name: MMSU-Reason
    description: "Spoken language understanding and reasoning benchmark subset."
    language: ["multi"]
    scenario: "speech understanding and reasoning"
    metric_hint: "accuracy"
    source: "https://arxiv.org/abs/2506.04779"
  ami:
    name: AMI Meeting Corpus
    description: "English multi-party meeting corpus, about 100 hours, scenario and non-scenario meetings, commonly used for ASR/diarization; meetings often involve 3-4 participants and overlapping speech."
    language: ["en"]
    scenario: "multi-party meetings with far/near-field microphones and overlap"
    metric_hint: "WER/DER"
    source: "https://groups.inf.ed.ac.uk/ami/corpus/"

tool_keys:
  sensevoice_small:
    display_name: SenseVoice-Small
    catalog_tool: null
    availability: external_or_uninstalled
  whisper_large_v3:
    display_name: Whisper large-v3
    catalog_tool: "whisperx.transcribe_audio"
    agent_tool_name: "transcribe_audio"
    availability: installed_but_check_config_model_arch
  parakeet_en:
    display_name: Parakeet-en
    catalog_tool: null
    availability: external_or_uninstalled
  gemini_3_0_pro:
    display_name: Gemini 3.0pro
    catalog_tool: null
    availability: external_lalm
  gemini_2_5_pro:
    display_name: Gemini 2.5pro
    catalog_tool: null
    availability: external_lalm
  qwen3_asr_1_7b:
    display_name: Qwen3-ASR-1.7B
    catalog_tool: "asr_qwen3.transcribe_qwenasr"
    agent_tool_name: "transcribe_qwenasr"
    availability: installed_catalog
  firered_llm_l_7b:
    display_name: FireRedLLM-L-7B
    catalog_tool: null
    fallback_catalog_tool: "fireredasr2s.transcribe_fireredasr"
    fallback_agent_tool_name: "transcribe_fireredasr"
    availability: external_or_uninstalled
  kimi_audio:
    display_name: Kimi Audio
    catalog_tool: null
    availability: external_lalm
  qwen3_omni:
    display_name: Qwen3 Omni
    catalog_tool: "omni_captioner.omni_caption"
    agent_tool_name: "omni_caption"
    availability: installed_as_perception_tool_not_pure_asr
  stepaudio_r1:
    display_name: Step-Audio-R1
    catalog_tool: null
    availability: external_or_uninstalled
  pipeline_reference:
    display_name: Pipeline
    catalog_tool: null
    availability: reported_system_not_single_tool

ranking_policy:
  match_order:
    - exact_skill_and_dataset
    - exact_skill_any_dataset
    - default_bindings_from_skill
  availability_policy:
    - prefer_available_catalog_tool
    - if_report_winner_has_fallback_catalog_tool_use_fallback_with_warning
    - otherwise_try_next_ranked_model
    - otherwise_use_skill_default_binding

