default_reference_workflows:
  ARC-Agent-NO1:
    repo_path: "/cpfs/user/jingpeng/workspace/AUDIO_AGENT/ref_flow/ARC-Agent-NO1/taltech_agent_challenge_source.zip"
    principles:
      - "Always gather evidence from speech LLM observations and acoustic tools when source models disagree or the task is complex."
      - "Use whole-audio tools first, then segment-specific validation."
      - "Category routing defaults: counting/music/speaker/emotion/scene/timing/content/signal."
  xlance-audio-reasoning-agent:
    repo_path: "/cpfs/user/jingpeng/workspace/AUDIO_AGENT/ref_flow/xlance-audio-reasoning-agent"
    principles:
      - "Compare Qwen-Omni and Step-Audio-R1 answers."
      - "Use auxiliary SED, caption, audio features, and visual解析结果 as arbitration evidence."
      - "Separate consistent and inconsistent cases; inconsistent cases need stronger selection/verification."
