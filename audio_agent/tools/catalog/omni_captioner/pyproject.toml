[project]
name = "omni-captioner-tool"
version = "1.0.0"
description = "Audio captioning using Qwen3-Omni-30B-A3B-Captioner for the Audio Agent Framework"
requires-python = ">=3.11"
authors = [
    {name = "Audio Agent Team"}
]

# Dependencies for Qwen3-Omni captioner
dependencies = [
    "transformers>=4.40.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "qwen-omni-utils",
    "accelerate>=0.25.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

# Build system (required by PEP 518)
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# uv-specific configuration
[tool.uv]
# allow-prereleases = true
